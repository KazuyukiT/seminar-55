[project]
name = "titanic70"
version = "0.1.0"
description = "70-minute Titanic seminar exercise"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "matplotlib>=3.8,<4",
  "statsmodels>=0.14,<0.15", "scikit-learn>=1.5,<2", "ipykernel>=6,<8",
]

[dependency-groups]
dev = ["nbformat>=5", "nbclient>=0.10"]
